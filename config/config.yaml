# Dual-Stream Deepfake Detection Configuration

# Data Configuration
# Options:
# - "UniDataPro/deepfake-videos-dataset" (10 video preview, full requires contact)
# - "local" (for Celeb-DF v2, FaceForensics++, etc. - place videos in data/raw/)
data:
  dataset_name: "UniDataPro/deepfake-videos-dataset"  # or "local" for local videos
  dataset_type: "huggingface"  # "huggingface" or "local"
  data_root: "data"
  raw_videos_dir: "data/raw"  # For local datasets
  frames_dir: "data/frames"
  faces_dir: "data/faces"
  frequency_dir: "data/frequency"
  train_split: 0.7
  val_split: 0.15
  test_split: 0.15
  frame_sampling_rate: 3  # frames per second
  face_size: 224
  face_crop_size: 256

# Preprocessing
preprocessing:
  use_mtcnn: true
  min_face_size: 40
  frequency_log_scale: true
  frequency_normalize: true
  augmentations:
    horizontal_flip: 0.5
    rotation_range: 15
    brightness_range: 0.2
    contrast_range: 0.2
    noise_std: 0.02  # Gaussian noise standard deviation (0 to disable)
    gaussian_blur_prob: 0.3  # Probability of applying Gaussian blur

# Model Architecture
model:
  spatial_backbone: "resnet18"  # or "efficientnet_b0"
  spatial_feature_dim: 256
  frequency_channels: 1  # 1 for magnitude only, 2 for magnitude+phase
  # Frequency stream now uses ResNet50 backbone (no frequency_layers needed)
  fusion_dim: 512
  dropout: 0.5  # Default dropout (0.5 for quad-stream, 0.3 for dual-stream, dynamically handled)
  pretrained: true
  freeze_spatial_backbone: false
  freeze_frequency_backbone: false

# Training Configuration
training:
  batch_size: 32
  num_epochs: 30  # Xception trained for max 30, multi-stream trained for max 40 (overridden in code/CLI)
  learning_rate: 1e-4  # Classification head / scratch streams learning rate
  backbone_learning_rate: 1e-5  # Pretrained spatial backbones learning rate
  optimizer: "adamw"
  weight_decay: 1e-5
  use_focal_loss: false  # BCEWithLogitsLoss is the default for balanced FF++ experiments
  focal_loss_alpha: 0.25  # Weighting factor for positive class
  focal_loss_gamma: 2.0  # Focusing parameter (higher = focus more on hard examples)
  oversample_real: true  # Oversample real videos to balance training batches
  real_oversample_ratio: 2.0  # How many times to oversample real videos (2.0 = 2x more real samples)
  scheduler: "cosine"  # or "step"
  scheduler_params:
    step_size: 10
    gamma: 0.1
  early_stopping:
    patience: 10
    metric: "val_auc"
  num_workers: 2
  pin_memory: true

# Evaluation
evaluation:
  metrics: ["accuracy", "precision", "recall", "f1", "auc", "eer"]
  video_level_aggregation: "mean"  # or "max", "median"

# Paths
paths:
  checkpoint_dir: "checkpoints"
  log_dir: "logs"
  results_dir: "results"

